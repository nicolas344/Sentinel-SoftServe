apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sentinel
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
      containers:
        - name: backend
          image: sentinel-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CHROMA_HOST
              value: "http://chromadb-svc:8000"
            - name: LOKI_URL
              value: "http://loki-svc:3100"
            - name: LANGFUSE_HOST
              value: "http://langfuse-svc:3000"
            - name: POSTGRES_HOST
              value: "postgres-svc"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "sentinel"
            - name: POSTGRES_PASSWORD
              value: "sentinel123"
            - name: POSTGRES_DB
              value: "sentinel_demo"
            - name: OPENAI_MODEL
              value: "gpt-4o-mini"
            - name: CORS_ORIGINS
              value: "http://sentinel.local,http://localhost:5173,http://frontend-svc"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
