apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sentinel
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager-svc:9093

    rule_files:
      - "/etc/prometheus/rules/alert_rules.yml"

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "backend"
        static_configs:
          - targets: ["backend-svc:8000"]

      - job_name: "postgres"
        static_configs:
          - targets: ["postgres-exporter-svc:9187"]
        metrics_path: /metrics
