apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chromadb
  namespace: sentinel
  labels:
    app: chromadb
spec:
  serviceName: "chromadb-svc"
  replicas: 1
  selector:
    matchLabels:
      app: chromadb
  template:
    metadata:
      labels:
        app: chromadb
    spec:
      containers:
        - name: chromadb
          image: chromadb/chroma:latest
          ports:
            - containerPort: 8000
          env:
            - name: IS_PERSISTENT
              value: "1"
            - name: PERSIST_DIRECTORY
              value: "/data"
            - name: CHROMA_SERVER_HOST
              value: "0.0.0.0"
          volumeMounts:
            - name: chromadb-data
              mountPath: /data
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v2/heartbeat
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: chromadb-data
          persistentVolumeClaim:
            claimName: chromadb-data
