groups:
  - name: docker_container_alerts
    interval: 5s
    rules:

      # ── Tier 0: Crash ─────────────────────────────────────────────────────────
      # Alerta cuando un contenedor deja de reportar métricas
      # container_last_seen almacena el Unix timestamp de la última vez que cAdvisor vio el contenedor.
      # Mientras corre: el valor ≈ time(). Al detenerse: el valor se congela y la diferencia crece.
      - alert: ContainerCrashed
        expr: >
          (time() - container_last_seen{id=~"/docker/[a-f0-9]+"}) > 20
        for: 0m
        labels:
          severity: high
        annotations:
          summary: >-
            Contenedor caído: {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
          description: >-
            El contenedor {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
            dejó de reportar métricas durante más de 20 segundos. Posible crash o parada inesperada.

      # ── Tier 1: Alta prioridad ────────────────────────────────────────────────

      # OOM Kill — el kernel terminó el contenedor por falta de memoria
      - alert: ContainerOOMKilled
        expr: >
          increase(container_oom_events_total{id=~"/docker/[a-f0-9]+"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: >-
            OOM Kill ({{ printf "%.0f" $value }} evento/s): {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
          description: >-
            El contenedor {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
            fue terminado por el OOM Killer del kernel.
            Se registraron {{ printf "%.0f" $value }} evento(s) de OOM en los últimos 5 minutos.

      # Alta memoria — uso supera el 85% del límite (señal de OOM inminente)
      # Expresión retorna porcentaje (0-100) directamente para evitar usar mul en anotaciones.
      - alert: ContainerHighMemory
        expr: >
          (
            container_memory_usage_bytes{id=~"/docker/[a-f0-9]+"}
            / container_spec_memory_limit_bytes{id=~"/docker/[a-f0-9]+"}
          ) * 100 > 85
          and container_spec_memory_limit_bytes{id=~"/docker/[a-f0-9]+"} > 0
        for: 2m
        labels:
          severity: high
        annotations:
          summary: >-
            Memoria al {{ printf "%.0f" $value }}% del límite: {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
          description: >-
            El contenedor {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
            lleva más de 2 minutos usando el {{ printf "%.0f" $value }}% de su límite de memoria.
            OOM Kill inminente.

      # CPU Throttling — CPU limitada más del 25% del tiempo durante 5 minutos
      # Expresión retorna porcentaje (0-100) directamente.
      - alert: ContainerCPUThrottling
        expr: >
          (
            rate(container_cpu_cfs_throttled_periods_total{id=~"/docker/[a-f0-9]+"}[5m])
            / rate(container_cpu_cfs_periods_total{id=~"/docker/[a-f0-9]+"}[5m])
          ) * 100 > 25
        for: 5m
        labels:
          severity: medium
        annotations:
          summary: >-
            CPU throttling al {{ printf "%.0f" $value }}%: {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
          description: >-
            El contenedor {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
            lleva 5 minutos con el {{ printf "%.0f" $value }}% de sus períodos de CPU throttled.
            La aplicación está degradada.

      # Restart loop — el contenedor reinició 3 o más veces en los últimos 10 minutos
      - alert: ContainerRestartLoop
        expr: >
          changes(container_start_time_seconds{id=~"/docker/[a-f0-9]+"}[10m]) >= 3
        for: 0m
        labels:
          severity: high
        annotations:
          summary: >-
            Restart loop ({{ printf "%.0f" $value }} reinicios): {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
          description: >-
            El contenedor {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
            se reinició {{ printf "%.0f" $value }} veces en los últimos 10 minutos. Posible CrashLoop.

      # Contenedor unhealthy — health check fallando
      # Nota: requiere que el contenedor tenga HEALTHCHECK configurado en su Dockerfile o docker-compose.
      - alert: ContainerUnhealthy
        expr: >
          container_health_state{id=~"/docker/[a-f0-9]+", health_status="unhealthy"} == 1
        for: 1m
        labels:
          severity: high
        annotations:
          summary: >-
            Health check fallando: {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
          description: >-
            El health check del contenedor {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
            lleva más de 1 minuto fallando. El servicio está vivo pero no responde correctamente.

      # ── Tier 2: Prioridad media ───────────────────────────────────────────────

      # Errores de red — más de 10 errores/segundo en recepción + transmisión
      - alert: ContainerNetworkErrors
        expr: >
          rate(container_network_receive_errors_total{id=~"/docker/[a-f0-9]+"}[5m])
          + rate(container_network_transmit_errors_total{id=~"/docker/[a-f0-9]+"}[5m]) > 10
        for: 2m
        labels:
          severity: medium
        annotations:
          summary: >-
            Errores de red ({{ printf "%.1f" $value }}/s): {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
          description: >-
            El contenedor {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
            presenta {{ printf "%.1f" $value }} errores de red por segundo durante 2 minutos.
            Posible problema de conectividad.

      # Paquetes descartados — más de 5 paquetes/segundo perdidos
      - alert: ContainerNetworkPacketDrop
        expr: >
          rate(container_network_receive_packets_dropped_total{id=~"/docker/[a-f0-9]+"}[5m])
          + rate(container_network_transmit_packets_dropped_total{id=~"/docker/[a-f0-9]+"}[5m]) > 5
        for: 2m
        labels:
          severity: medium
        annotations:
          summary: >-
            Paquetes descartados ({{ printf "%.1f" $value }}/s): {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
          description: >-
            El contenedor {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
            está descartando {{ printf "%.1f" $value }} paquetes de red por segundo.
            Posible saturación de red.

      # Presión de disco — uso supera el 85% del límite del filesystem
      # Expresión retorna porcentaje (0-100) directamente.
      - alert: ContainerDiskPressure
        expr: >
          (
            container_fs_usage_bytes{id=~"/docker/[a-f0-9]+", device!="", device!~"tmpfs.*"}
            / container_fs_limit_bytes{id=~"/docker/[a-f0-9]+", device!="", device!~"tmpfs.*"}
          ) * 100 > 85
          and container_fs_limit_bytes{id=~"/docker/[a-f0-9]+", device!="", device!~"tmpfs.*"} > 0
        for: 5m
        labels:
          severity: high
        annotations:
          summary: >-
            Disco al {{ printf "%.0f" $value }}% del límite: {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
          description: >-
            El contenedor {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
            lleva 5 minutos usando el {{ printf "%.0f" $value }}% de su límite de disco.
            Riesgo de errores de escritura.

      # Alto uso de swap — usa más del 50% del swap limit configurado
      # Expresión retorna porcentaje (0-100) directamente.
      - alert: ContainerHighSwap
        expr: >
          container_memory_swap{id=~"/docker/[a-f0-9]+"} > 0
          and container_spec_memory_swap_limit_bytes{id=~"/docker/[a-f0-9]+"} > 0
          and (
            container_memory_swap{id=~"/docker/[a-f0-9]+"}
            / container_spec_memory_swap_limit_bytes{id=~"/docker/[a-f0-9]+"}
          ) * 100 > 50
        for: 5m
        labels:
          severity: medium
        annotations:
          summary: >-
            Swap al {{ printf "%.0f" $value }}% del límite: {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
          description: >-
            El contenedor {{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }}
            lleva 5 minutos usando el {{ printf "%.0f" $value }}% de su límite de swap.
            Posible presión de memoria sostenida.

# ── PostgreSQL Alerts (postgres-exporter) ────────────────────────────────────
# Requiere postgres-exporter corriendo y configurado en prometheus.yml.
# Todas las alertas incluyen source_type: database para que alert_processor
# construya el target como "postgres/<datname>" y enrute al PostgresAgent.
  - name: postgres_alerts
    interval: 15s
    rules:

      # Conexiones agotadas — más del 90% de max_connections en uso
      - alert: PostgresConnectionsExhausted
        expr: >
          (
            sum by (datname, instance) (
              pg_stat_activity_count{datname!="", datname!="template0", datname!="template1"}
            )
            /
            pg_settings_max_connections
          ) * 100 > 90
        for: 2m
        labels:
          severity: critical
          source_type: database
        annotations:
          summary: >-
            Conexiones al {{ printf "%.0f" $value }}%: {{ $labels.datname }}
          description: >-
            La base de datos {{ $labels.datname }} lleva 2 minutos con el
            {{ printf "%.0f" $value }}% de sus conexiones en uso.
            Riesgo de rechazo de nuevas conexiones.

      # Transacción larga — query activa por más de 5 minutos
      - alert: PostgresLongRunningTransaction
        expr: >
          max by (datname, instance) (
            max_over_time(
              pg_stat_activity_max_tx_duration{datname!="", datname!="template0", datname!="template1", state="active"}[5m]
            )
          ) > 300
        for: 0m
        labels:
          severity: high
          source_type: database
        annotations:
          summary: >-
            Transacción larga ({{ printf "%.0f" $value }}s): {{ $labels.datname }}
          description: >-
            Hay una transacción activa de {{ printf "%.0f" $value }} segundos en
            {{ $labels.datname }}. Puede estar bloqueando otras operaciones.

      # Deadlocks detectados
      - alert: PostgresDeadLocks
        expr: >
          rate(pg_stat_database_deadlocks{datname!="", datname!="template0", datname!="template1"}[5m]) > 0
        for: 0m
        labels:
          severity: high
          source_type: database
        annotations:
          summary: >-
            Deadlock detectado: {{ $labels.datname }}
          description: >-
            Se detectaron deadlocks en la base de datos {{ $labels.datname }}.
            Indica transacciones concurrentes con conflictos de lock.

      # Lag de replicación — más de 30 segundos de retraso
      - alert: PostgresReplicationLag
        expr: >
          pg_replication_lag > 30
        for: 2m
        labels:
          severity: critical
          source_type: database
        annotations:
          summary: >-
            Replication lag: {{ printf "%.0f" $value }}s
          description: >-
            La réplica lleva 2 minutos con {{ printf "%.0f" $value }} segundos de lag
            respecto al primario. Riesgo de pérdida de datos si falla el primario.

      # Cache hit ratio bajo — menos del 90% de lecturas servidas desde cache
      - alert: PostgresLowCacheHitRatio
        expr: >
          (
            sum by (datname, instance) (
              rate(pg_stat_database_blks_hit{datname!="", datname!="template0", datname!="template1"}[5m])
            )
            /
            (
              sum by (datname, instance) (
                rate(pg_stat_database_blks_hit{datname!="", datname!="template0", datname!="template1"}[5m])
              )
              +
              sum by (datname, instance) (
                rate(pg_stat_database_blks_read{datname!="", datname!="template0", datname!="template1"}[5m])
              )
            )
          ) * 100 < 90
        for: 5m
        labels:
          severity: medium
          source_type: database
        annotations:
          summary: >-
            Cache hit ratio {{ printf "%.1f" $value }}%: {{ $labels.datname }}
          description: >-
            La base de datos {{ $labels.datname }} lleva 5 minutos con solo
            el {{ printf "%.1f" $value }}% de lecturas desde cache.
            Puede indicar queries pesadas o shared_buffers insuficiente.

      # Crecimiento acelerado — la BD crece más de 100MB en 1 hora
      - alert: PostgresDatabaseSizeGrowth
        expr: >
          rate(pg_database_size_bytes{datname!="", datname!="template0", datname!="template1"}[1h])
          / 1048576 > 100
        for: 0m
        labels:
          severity: medium
          source_type: database
        annotations:
          summary: >-
            Crecimiento rápido ({{ printf "%.1f" $value }} MB/h): {{ $labels.datname }}
          description: >-
            La base de datos {{ $labels.datname }} está creciendo más de 100MB/hora.
            Posible insert masivo, falta de vacuums o acumulación de dead tuples.
