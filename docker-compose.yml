services:

  # ── Backend FastAPI ────────────────────────────────────────────────────────
  backend:
    build: ./Backend
    container_name: sentinel-backend
    env_file:
      - ./Backend/.env
    environment:
      # Sobreescribe las URLs de localhost del .env con nombres de servicio Docker.
      # El .env usa localhost (válido para desarrollo local fuera de Docker).
      # Dentro del container, los servicios son accesibles por su nombre de servicio.
      CHROMA_HOST: "http://chromadb:8000"
      LOKI_URL: "http://loki:3100"
      LANGFUSE_HOST: "http://langfuse:3000"
      PROMETHEUS_URL: "http://prometheus:9090"
      ALERTMANAGER_URL: "http://alertmanager:9093"
      PYTHONDONTWRITEBYTECODE: "1"   # evita __pycache__ en código fuente → no dispara WatchFiles
      # Socket de Podman: en Linux rootless el UID suele ser 1000.
      # Si el host usa un UID diferente, ajustar la ruta del volumen y esta variable.
      # En macOS (Docker Desktop) este socket no existe y la variable queda sin efecto.
      PODMAN_HOST: "unix:///run/podman/podman.sock"
      # Kubernetes: el SDK busca /root/.kube/config cuando corre fuera del clúster.
      # Si el kubeconfig no está en la ruta estándar, sobreescribir con KUBECONFIG.
      KUBECONFIG: "/root/.kube/config"
      # K8S_PROXY_URL: URL del kubectl proxy para entornos Docker Desktop (macOS/Windows).
      # En Docker Desktop el API server (127.0.0.1:6443) no es alcanzable desde contenedores.
      # Solución: antes del demo ejecutar en el host:
      #   kubectl proxy --port=8555 --address=<LAN_IP> --accept-hosts='.*' &
      # Y ajustar esta variable con la IP LAN del host (ver: ifconfig | grep "inet 192")
      # K8S_PROXY_URL: dejar vacío por defecto. Solo necesario en Docker Desktop
      # donde 127.0.0.1:6443 no es alcanzable desde contenedores.
      # Configurar con la IP LAN del host antes del demo:
      #   kubectl proxy --port=8555 --address=<LAN_IP> --accept-hosts='.*' &
      K8S_PROXY_URL: ""
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # Socket de Podman (solo disponible en Linux con Podman instalado).
      # En macOS Docker Desktop este path no existe; Docker Compose lo ignora silenciosamente.
      - /run/user/1000/podman/podman.sock:/run/podman/podman.sock:rw
      # Kubeconfig de Kubernetes (para desarrollo local y acceso desde el backend).
      # En producción se usa in-cluster config (ServiceAccount automático de K8s).
      # En macOS/Linux: ~/.kube/config montado como read-only.
      - ${HOME}/.kube:/root/.kube:ro
      - backend_env:/app/env        # aísla virtualenv del host → evita WatchFiles storms
      - chroma_cache:/root/.cache/chroma  # persiste modelo ONNX (~79MB) entre reinicios
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - loki
      - chromadb
      - langfuse
    restart: unless-stopped

  # ── Frontend React + Vite ──────────────────────────────────────────────────
  frontend:
    build: ./Frontend
    container_name: sentinel-frontend
    env_file:
      - ./Frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  # ── Métricas de contenedores Docker ────────────────────────────────────────
  # cAdvisor: funciona en macOS (Docker Desktop usa VM Linux, /sys y /var/run
  # son paths del VM) y en Linux. Podman usa un exporter separado (podman-exporter).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: sentinel-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    command:
      - --docker_only=true
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ── Recolección de métricas y evaluación de reglas ─────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ── Enrutamiento de alertas al backend de Sentinel ─────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: sentinel-alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9093:9093"
    restart: unless-stopped

  # ── Almacenamiento de logs ──────────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: sentinel-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # ── Colector de logs desde Docker ──────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: sentinel-promtail
    volumes:
      - /run/docker.sock:/var/run/docker.sock
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  # ── Observabilidad del agente LangGraph ────────────────────────────────────
  langfuse-db:
    image: postgres:15-alpine
    container_name: sentinel-langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_data:/var/lib/postgresql/data
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: sentinel-langfuse
    depends_on:
      - langfuse-db
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: sentinel-nextauth-secret-2024
      NEXTAUTH_URL: http://localhost:3001
      SALT: sentinel-salt-2024
    restart: unless-stopped

  # ── Base de datos demo para incidentes PostgreSQL ──────────────────────────
  postgres-demo:
    image: postgres:15-alpine
    container_name: sentinel-postgres-demo
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel123
      POSTGRES_DB: sentinel_demo
    ports:
      - "5433:5432"
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── Exporter de métricas PostgreSQL → Prometheus ───────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: sentinel-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://sentinel:sentinel123@postgres-demo:5432/sentinel_demo?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres-demo
    restart: unless-stopped

  # ── Exporter de métricas Podman → Prometheus ──────────────────────────────
  # Requiere Podman instalado en el host con el socket rootless activo.
  # En Linux: systemctl --user enable --now podman.socket
  # El socket estándar es /run/user/1000/podman/podman.sock (UID 1000).
  podman-exporter:
    image: quay.io/navidys/prometheus-podman-exporter:latest
    container_name: sentinel-podman-exporter
    group_add:
      - "1000"
    environment:
      CONTAINER_HOST: "unix:///run/podman/podman.sock"
      XDG_RUNTIME_DIR: "/tmp"
      HOME: "/tmp"
    volumes:
      - /run/user/1000/podman/podman.sock:/run/podman/podman.sock:ro
    ports:
      - "9882:9882"
    restart: unless-stopped

  # ── Vector DB para RAG (runbooks y conocimiento del agente) ────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: sentinel-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  # ── Visualización (útil para el demo) ─────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: sentinel-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=sentinel123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  langfuse_data:
  chroma_data:
  backend_env:
  chroma_cache:
  postgres_demo_data:
