global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "name"]
  group_wait: 5s        # Espera 5s antes de enviar (agrupa alertas relacionadas)
  group_interval: 10s   # Espera entre envíos para el mismo grupo
  repeat_interval: 1h   # No repetir la misma alerta por 1 hora
  receiver: "sentinel-webhook"

receivers:
  - name: "sentinel-webhook"
    webhook_configs:
      - url: "http://sentinel-backend:8000/api/alerts"
        send_resolved: true

inhibit_rules:
  # OOM Kill es la causa raíz — suprimir alarmas de síntomas del mismo contenedor
  - source_matchers:
      - alertname = "ContainerOOMKilled"
    target_matchers:
      - alertname = "ContainerHighMemory"
    equal:
      - name

  - source_matchers:
      - alertname = "ContainerOOMKilled"
    target_matchers:
      - alertname = "ContainerCrashed"
    equal:
      - name

  # Crash definitivo — suprimir alertas de degradación del mismo contenedor
  - source_matchers:
      - alertname = "ContainerCrashed"
    target_matchers:
      - alertname =~ "ContainerHighMemory|ContainerRestartLoop|ContainerUnhealthy|ContainerCPUThrottling|ContainerDiskPressure|ContainerHighSwap"
    equal:
      - name

  # Restart loop activo — suprimir alertas de degradación puntual (el loop ya los explica)
  - source_matchers:
      - alertname = "ContainerRestartLoop"
    target_matchers:
      - alertname =~ "ContainerCPUThrottling|ContainerNetworkErrors|ContainerNetworkPacketDrop"
    equal:
      - name
